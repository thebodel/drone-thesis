[project]
name = "drone-thesis"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "thebodel", email = "bogdansuhina14@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "clearml>=2.1.12",
    "gymnasium>=1.4.0",
    "matplotlib>=3.11.2",
    "numpy>=1.26.4",
    "optuna>=4.5.0",
    "pyflyt>=0.29.0",
    "stable-baselines3>=2.9.0",
    "tensorboard>=2.21.0",
]

[project.scripts]
drone-thesis = "drone_thesis:main"

[build-system]
requires = ["uv_build>=0.12.24,<0.13.0"]
build-backend = "uv_build"
